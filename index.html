
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Violet World</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;touch-action:none}
#info{position:fixed;top:12px;left:12px;background:#211735e8;color:white;padding:12px 14px;border-radius:12px;z-index:2;pointer-events:none}
#info b{font-size:20px;color:#c9a5ff}
#status{font-size:12px;margin-top:5px}
#controls{position:fixed;bottom:18px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end;z-index:3;pointer-events:none}
.pad{display:grid;grid-template-columns:54px 54px 54px;grid-template-rows:54px 54px;gap:5px}
button{pointer-events:auto;width:54px;height:54px;border:1px solid #ffffff70;border-radius:14px;background:#28203ddd;color:white;font-size:23px;touch-action:none;user-select:none;-webkit-user-select:none}
button:active{background:#8955df}
#up{grid-column:2}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#jump{width:70px;height:70px;border-radius:50%;background:#7446c9dd}
#hint{position:fixed;bottom:145px;left:15px;color:white;background:#17152d99;padding:7px 10px;border-radius:8px;font-size:12px;pointer-events:none}
</style>
</head>
<body>
<div id="info"><b>Violet World</b><div id="status">Preparando personagem...</div></div>
<div id="hint">Arraste o cenário para girar a câmera</div>
<div id="controls">
  <div class="pad">
    <button id="up">▲</button>
    <button id="left">◀</button>
    <button id="down">▼</button>
    <button id="right">▶</button>
  </div>
  <button id="jump">⬆</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,65,150);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x60734b,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(25,40,20);
sun.castShadow=true;
scene.add(sun);

function cube(x,y,z,sx,sy,sz,color){
  const m=new THREE.Mesh(
    new THREE.BoxGeometry(sx,sy,sz),
    new THREE.MeshStandardMaterial({color,roughness:.9})
  );
  m.position.set(x,y,z);
  m.castShadow=true;
  m.receiveShadow=true;
  scene.add(m);
  return m;
}

// Mundo
cube(0,-.5,0,120,1,120,0x62b94f);

for(let i=-5;i<=5;i++){
  cube(i*3,.015,0,2.8,.04,2.8,i%2?0xb9b9b9:0xd6d6d6);
  cube(0,.02,i*3,2.8,.04,2.8,i%2?0xb9b9b9:0xd6d6d6);
}

for(let i=0;i<65;i++){
  const x=(Math.random()-.5)*100;
  const z=(Math.random()-.5)*100;
  if(Math.abs(x)<12&&Math.abs(z)<12)continue;
  cube(x,1,z,.7,2,.7,0x79502c);
  cube(x,2.8,z,2.5,2.5,2.5,[0x299447,0x37a84a,0x21843b][i%3]);
}

cube(-8,1,-8,5,2,5,0x9b63ed);
cube(-8,3,-8,3,2,3,0xf1c65c);
cube(8,1,-8,5,2,5,0xe76f8a);
cube(8,3,-8,3,2,3,0x64c9e8);
cube(-8,1,8,5,2,5,0x4385e8);
cube(8,1,8,5,2,5,0xf39b43);

// Personagem estilo bloco
// A frente do rosto fica virada para o eixo local -Z.
const player=new THREE.Group();
scene.add(player);

const mat=(color,roughness=.85)=>new THREE.MeshStandardMaterial({color,roughness});
const shirt=mat(0x874be8);
const skin=mat(0xffc995);
const pants=mat(0x29243b);
const shoe=mat(0x171522);
const eyeWhite=mat(0xffffff);
const eyeBlack=mat(0x24202a);
const hair=mat(0x39234b);
const smileMat=mat(0x703e37);

function makePart(parent,material,x,y,z,sx,sy,sz){
  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(sx,sy,sz),
    material
  );
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  parent.add(mesh);
  return mesh;
}

// Torso e pescoço
makePart(player,shirt,0,1.62,0,.95,1.05,.48);
makePart(player,skin,0,2.19,0,.25,.2,.25);

// Cabeça
makePart(player,skin,0,2.57,0,.78,.72,.7);

// Cabelo em blocos no topo e atrás
makePart(player,hair,0,2.94,.025,.81,.19,.73);
makePart(player,hair,-.31,2.79,.05,.18,.27,.68);
makePart(player,hair,.31,2.79,.05,.18,.27,.68);

// Olhos no lado da frente (-Z)
makePart(player,eyeWhite,-.17,2.62,-.357,.15,.15,.045);
makePart(player,eyeWhite,.17,2.62,-.357,.15,.15,.045);
makePart(player,eyeBlack,-.16,2.62,-.385,.065,.09,.025);
makePart(player,eyeBlack,.18,2.62,-.385,.065,.09,.025);

// Sorriso simples
makePart(player,smileMat,0,2.43,-.361,.22,.035,.025);
makePart(player,smileMat,-.105,2.45,-.36,.035,.045,.025);
makePart(player,smileMat,.105,2.45,-.36,.035,.045,.025);

// Braços articulados: o pivô fica no ombro.
function makeArm(x){
  const pivot=new THREE.Group();
  pivot.position.set(x,2.02,0);
  player.add(pivot);

  makePart(pivot,shirt,0,-.18,0,.32,.48,.36);
  makePart(pivot,skin,0,-.55,0,.3,.32,.33);
  return pivot;
}
const leftArm=makeArm(-.65);
const rightArm=makeArm(.65);

// Pernas articuladas: o pivô fica no quadril.
function makeLeg(x){
  const pivot=new THREE.Group();
  pivot.position.set(x,1.15,0);
  player.add(pivot);

  makePart(pivot,pants,0,-.35,0,.37,.68,.4);
  makePart(pivot,shoe,0,-.72,-.045,.39,.17,.46);
  return pivot;
}
const leftLeg=makeLeg(-.25);
const rightLeg=makeLeg(.25);

player.position.set(0,0,5);

// Controles originais
const keys={w:false,s:false,a:false,d:false};
const keyMap={up:'w',down:'s',left:'a',right:'d'};

for(const [id,key] of Object.entries(keyMap)){
  const btn=document.getElementById(id);
  btn.addEventListener('pointerdown',e=>{
    e.preventDefault();
    e.stopPropagation();
    keys[key]=true;
    btn.setPointerCapture(e.pointerId);
  });
  for(const ev of ['pointerup','pointercancel','lostpointercapture']){
    btn.addEventListener(ev,()=>keys[key]=false);
  }
}

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k in keys)keys[k]=true;
  if(e.code==='Space')jump();
});
addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k in keys)keys[k]=false;
});
addEventListener('blur',()=>{
  for(const k in keys)keys[k]=false;
});

// Pulo
let velocityY=0;
let grounded=true;

function jump(){
  if(grounded){
    velocityY=7;
    grounded=false;
  }
}
document.getElementById('jump').addEventListener('pointerdown',e=>{
  e.preventDefault();
  e.stopPropagation();
  jump();
});

// Câmera: mesma lógica da versão funcional
let yaw=0;
let dragging=false;
let lastX=0;
let dragPointer=null;

renderer.domElement.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  dragging=true;
  dragPointer=e.pointerId;
  lastX=e.clientX;
  renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener('pointermove',e=>{
  if(!dragging||e.pointerId!==dragPointer)return;
  yaw-=(e.clientX-lastX)*.006;
  lastX=e.clientX;
});

function stopDrag(e){
  if(e.pointerId===dragPointer){
    dragging=false;
    dragPointer=null;
  }
}
renderer.domElement.addEventListener('pointerup',stopDrag);
renderer.domElement.addEventListener('pointercancel',stopDrag);

// Animações
const clock=new THREE.Clock();
const target=new THREE.Vector3();
const desired=new THREE.Vector3();
const look=new THREE.Vector3();
let walkTime=0;

const smooth=(current,targetValue,speed,dt)=>
  THREE.MathUtils.damp(current,targetValue,speed,dt);

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.04);

  const forward=(keys.w?1:0)-(keys.s?1:0);
  const side=(keys.d?1:0)-(keys.a?1:0);
  const length=Math.hypot(forward,side);
  let dx=0,dz=0;

  if(length>0){
    const f=forward/length;
    const s=side/length;

    dx=(Math.sin(yaw)*f+Math.cos(yaw)*s)*5*dt;
    dz=(-Math.cos(yaw)*f+Math.sin(yaw)*s)*5*dt;

    // O rosto aponta para a direção do movimento.
    player.rotation.y=Math.atan2(-dx,-dz);
    walkTime+=dt*9;
  }

  player.position.x=THREE.MathUtils.clamp(player.position.x+dx,-57,57);
  player.position.z=THREE.MathUtils.clamp(player.position.z+dz,-57,57);

  // Física simples de pulo
  velocityY-=18*dt;
  player.position.y+=velocityY*dt;

  if(player.position.y<=0){
    player.position.y=0;
    velocityY=0;
    grounded=true;
  }

  const airborne=!grounded;
  const moving=length>0;

  // Caminhada: braços e pernas em sentidos opostos.
  const swing=moving?Math.sin(walkTime)*.65:0;
  const armSwing=moving?Math.sin(walkTime+Math.PI)*.65:0;

  const jumpBlend=airborne?1:0;

  leftLeg.rotation.x=smooth(
    leftLeg.rotation.x,
    swing-jumpBlend*.45,12,dt
  );
  rightLeg.rotation.x=smooth(
    rightLeg.rotation.x,
    -swing-jumpBlend*.45,12,dt
  );

  leftArm.rotation.x=smooth(
    leftArm.rotation.x,
    armSwing,12,dt
  );
  rightArm.rotation.x=smooth(
    rightArm.rotation.x,
    -armSwing,12,dt
  );

  // Braços abrem um pouco durante o salto.
  leftArm.rotation.z=smooth(
    leftArm.rotation.z,
    jumpBlend*.22,10,dt
  );
  rightArm.rotation.z=smooth(
    rightArm.rotation.z,
    -jumpBlend*.22,10,dt
  );

  // Câmera suave seguindo o personagem.
  target.set(
    player.position.x,
    player.position.y+1.55,
    player.position.z
  );

  desired.set(
    target.x-Math.sin(yaw)*8,
    target.y+3.5,
    target.z+Math.cos(yaw)*8
  );

  camera.position.lerp(desired,1-Math.exp(-6*dt));
  look.copy(target);
  camera.lookAt(look);

  const status=document.getElementById('status');
  status.textContent=airborne?'Pulando!':moving?'Explorando...':'Pronto para explorar';

  renderer.render(scene,camera);
}

camera.position.set(0,5,13);
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
