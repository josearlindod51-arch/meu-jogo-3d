<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Violet World</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  overflow: hidden;
  background: #87ceeb;
  font-family: Arial, sans-serif;
  touch-action: none;
}

canvas {
  display: block;
}

#logo {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 5;
  color: white;
  font-size: 23px;
  font-weight: 900;
  text-shadow: 2px 3px 0 #54278f, -1px -1px 0 #54278f;
  pointer-events: none;
}

#controls {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 10;
}

.pad {
  position: absolute;
  left: 20px;
  bottom: 25px;
  width: 150px;
  height: 145px;
  pointer-events: auto;
}

.ctrl {
  position: absolute;
  width: 48px;
  height: 48px;
  border: 2px solid rgba(255,255,255,.75);
  border-radius: 13px;
  background: rgba(70,40,120,.72);
  color: white;
  font-size: 25px;
  font-weight: bold;
  display: flex;
  justify-content: center;
  align-items: center;
  user-select: none;
  touch-action: none;
}

.ctrl:active {
  background: rgba(150,90,255,.95);
  transform: scale(.94);
}

#up {
  left: 51px;
  top: 0;
}

#down {
  left: 51px;
  bottom: 0;
}

#left {
  left: 0;
  top: 48px;
}

#right {
  right: 0;
  top: 48px;
}

#jump {
  position: absolute;
  right: 24px;
  bottom: 38px;
  width: 72px;
  height: 72px;
  border-radius: 50%;
  font-size: 16px;
  background: rgba(112,55,190,.8);
  pointer-events: auto;
}

@media (min-width: 900px) {
  .pad {
    left: 30px;
    bottom: 25px;
  }

  #jump {
    right: 35px;
    bottom: 30px;
  }
}
</style>
</head>

<body>
<div id="logo">Violet World</div>

<div id="controls">
  <div class="pad">
    <div class="ctrl" id="up">▲</div>
    <div class="ctrl" id="down">▼</div>
    <div class="ctrl" id="left">◀</div>
    <div class="ctrl" id="right">▶</div>
  </div>

  <div class="ctrl" id="jump">PULAR</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 45, 150);

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  500
);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ILUMINAÇÃO
scene.add(new THREE.HemisphereLight(0xffffff, 0x71805b, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(-30, 50, 25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60;
sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60;
sun.shadow.camera.bottom = -60;
scene.add(sun);

// MATERIAIS
function material(color) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness: 0.85
  });
}

const grassMat = material(0x55a844);
const dirtMat = material(0x76503a);
const stoneMat = material(0x858b96);
const trunkMat = material(0x79502d);
const leafMat = material(0x238344);

// CHÃO
const ground = new THREE.Mesh(
  new THREE.BoxGeometry(200, 2, 200),
  grassMat
);

ground.position.y = -1;
ground.receiveShadow = true;
scene.add(ground);

// BASE DE TERRA
const dirt = new THREE.Mesh(
  new THREE.BoxGeometry(200, 3, 200),
  dirtMat
);

dirt.position.y = -3.5;
dirt.receiveShadow = true;
scene.add(dirt);

// BLOCOS DECORATIVOS
function makeBlock(x, y, z, sx, sy, sz, mat) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(sx, sy, sz),
    mat
  );

  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

// CAMINHO DE PEDRA
for (let i = 0; i < 13; i++) {
  makeBlock(
    0,
    0.03,
    -5 - i * 3,
    3.5,
    0.12,
    2.5,
    stoneMat
  );
}

// ÁRVORES
function makeTree(x, z, scale = 1) {
  makeBlock(
    x, 1.5 * scale, z,
    0.8 * scale, 3 * scale, 0.8 * scale,
    trunkMat
  );

  makeBlock(
    x, 3.5 * scale, z,
    3.2 * scale, 2.5 * scale, 3.2 * scale,
    leafMat
  );

  makeBlock(
    x, 5 * scale, z,
    2.3 * scale, 2 * scale, 2.3 * scale,
    leafMat
  );
}

for (let i = 0; i < 35; i++) {
  const side = Math.random() < 0.5 ? -1 : 1;
  const x = side * (8 + Math.random() * 35);
  const z = 10 - Math.random() * 100;
  makeTree(x, z, 0.7 + Math.random() * 0.7);
}

// NUVENS
const cloudMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  roughness: 1
});

function makeCloud(x, y, z) {
  const cloud = new THREE.Group();

  for (let i = 0; i < 5; i++) {
    const puff = new THREE.Mesh(
      new THREE.BoxGeometry(
        3 + Math.random() * 2,
        1.4 + Math.random(),
        2
      ),
      cloudMat
    );

    puff.position.set(
      (i - 2) * 1.8,
      Math.random() * 0.7,
      Math.random() * 0.5
    );

    cloud.add(puff);
  }

  cloud.position.set(x, y, z);
  scene.add(cloud);
}

makeCloud(-15, 22, -25);
makeCloud(15, 25, -45);
makeCloud(30, 20, 0);
makeCloud(-35, 27, 10);

// PERSONAGEM EM BLOCOS
const player = new THREE.Group();
scene.add(player);

const body = new THREE.Group();
player.add(body);

const skinMat = material(0xffc58f);
const shirtMat = material(0x8b42d6);
const pantsMat = material(0x30364d);
const shoeMat = material(0xeeeeee);
const hairMat = material(0x38251e);
const eyeMat = new THREE.MeshStandardMaterial({
  color: 0x171717,
  roughness: 0.5
});
const mouthMat = material(0x9b3434);

function part(parent, sx, sy, sz, mat, x, y, z) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(sx, sy, sz),
    mat
  );

  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

// CORPO
part(body, 1.15, 1.35, 0.62, shirtMat, 0, 1.95, 0);

// CABEÇA
const head = new THREE.Group();
head.position.set(0, 3.05, 0);
body.add(head);

part(head, 1.05, 1.05, 1.0, skinMat, 0, 0, 0);
part(head, 1.1, 0.28, 1.08, hairMat, 0, 0.55, 0.02);
part(head, 0.3, 0.35, 1.08, hairMat, -0.39, 0.34, 0.02);
part(head, 0.12, 0.15, 0.045, eyeMat, -0.23, 0.08, -0.515);
part(head, 0.12, 0.15, 0.045, eyeMat, 0.23, 0.08, -0.515);
part(head, 0.25, 0.055, 0.045, mouthMat, 0, -0.23, -0.52);

// BRAÇOS E PERNAS COM PIVÔ
function makeLimb(sx, sy, sz, mat, x, pivotY, z, offsetY) {
  const pivot = new THREE.Group();
  pivot.position.set(x, pivotY, z);
  body.add(pivot);

  part(pivot, sx, sy, sz, mat, 0, -offsetY, 0);
  return pivot;
}

const armL = makeLimb(0.38, 1.2, 0.42, shirtMat, -0.82, 2.48, 0, 0.3);
const armR = makeLimb(0.38, 1.2, 0.42, shirtMat, 0.82, 2.48, 0, 0.3);
part(armL, 0.36, 0.32, 0.4, skinMat, 0, -0.76, 0);
part(armR, 0.36, 0.32, 0.4, skinMat, 0, -0.76, 0);

const legL = makeLimb(0.46, 1.05, 0.48, pantsMat, -0.3, 1.35, 0, 0.48);
const legR = makeLimb(0.46, 1.05, 0.48, pantsMat, 0.3, 1.35, 0, 0.48);
part(legL, 0.48, 0.25, 0.68, shoeMat, 0, -0.96, -0.08);
part(legR, 0.48, 0.25, 0.68, shoeMat, 0, -0.96, -0.08);

player.position.set(0, 0, 5);

// CONTROLES
const keys = {};
const held = { up: false, down: false, left: false, right: false };

window.addEventListener('keydown', (e) => {
  keys[e.key.toLowerCase()] = true;
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(e.key.toLowerCase())) {
    e.preventDefault();
  }
  if (e.key === ' ' || e.key.toLowerCase() === 'w') {
    if (e.key === ' ') jump();
  }
});

window.addEventListener('keyup', (e) => {
  keys[e.key.toLowerCase()] = false;
});

function bindButton(id, name) {
  const el = document.getElementById(id);
  const start = (e) => {
    e.preventDefault();
    held[name] = true;
    el.setPointerCapture?.(e.pointerId);
  };
  const stop = (e) => {
    e.preventDefault();
    held[name] = false;
  };

  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointercancel', stop);
  el.addEventListener('lostpointercapture', () => { held[name] = false; });
}

bindButton('up', 'up');
bindButton('down', 'down');
bindButton('left', 'left');
bindButton('right', 'right');

// PULO
let verticalVelocity = 0;
let grounded = true;

function jump() {
  if (!grounded) return;
  verticalVelocity = 8.5;
  grounded = false;
}

document.getElementById('jump').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  jump();
});

// CÂMERA GIRATÓRIA CORRIGIDA
let yaw = 0; // Alinhado com a posição inicial correta
let pitch = 0.22;
let dragging = false;
let lastX = 0;
let lastY = 0;

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener('pointerup', () => { dragging = false; });
window.addEventListener('pointercancel', () => { dragging = false; });

window.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;

  yaw -= dx * 0.006; // Rotação fluida e correta com o arraste
  pitch += dy * 0.004;
  pitch = THREE.MathUtils.clamp(pitch, -0.1, 0.85);

  lastX = e.clientX;
  lastY = e.clientY;
});

// MOVIMENTO E ANIMAÇÃO
const clock = new THREE.Clock();
let walkTime = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.04);

  let forward = 0;
  let sideways = 0;

  if (keys['w'] || keys['arrowup'] || held.up) forward += 1;
  if (keys['s'] || keys['arrowdown'] || held.down) forward -= 1;
  if (keys['a'] || keys['arrowleft'] || held.left) sideways -= 1;
  if (keys['d'] || keys['arrowright'] || held.right) sideways += 1;

  const moving = forward !== 0 || sideways !== 0;

  if (moving) {
    const len = Math.sqrt(forward * forward + sideways * sideways);
    forward /= len;
    sideways /= len;

    const speed = 7;

    // CÁLCULO DE VETORES CORRIGIDO E ALINHADO COM A CÂMERA EM TERCEIRA PESSOA
    const moveX = Math.sin(yaw) * forward - Math.cos(yaw) * sideways;
    const moveZ = Math.cos(yaw) * forward + Math.sin(yaw) * sideways;

    player.position.x += moveX * speed * dt;
    player.position.z += moveZ * speed * dt;

    // Rotação suave do personagem para a direção exata do movimento
    player.rotation.y = Math.atan2(moveX, moveZ);
    walkTime += dt * 10;
  }

  // LIMITES DO MUNDO
  player.position.x = THREE.MathUtils.clamp(player.position.x, -90, 90);
  player.position.z = THREE.MathUtils.clamp(player.position.z, -90, 90);

  // GRAVIDADE
  verticalVelocity -= 22 * dt;
  player.position.y += verticalVelocity * dt;

  if (player.position.y <= 0) {
    player.position.y = 0;
    verticalVelocity = 0;
    grounded = true;
  }

  const airborne = !grounded;

  // ANIMAÇÃO DOS MEMBROS
  if (moving && !airborne) {
    const swing = Math.sin(walkTime) * 0.65;
    armL.rotation.x = swing;
    armR.rotation.x = -swing;
    legL.rotation.x = -swing;
    legR.rotation.x = swing;
    body.position.y = Math.abs(Math.sin(walkTime * 2)) * 0.07;
  } else if (airborne) {
    armL.rotation.x = -1.1;
    armR.rotation.x = -1.1;
    legL.rotation.x = -0.35;
    legR.rotation.x = 0.35;
    body.position.y = 0;
  } else {
    armL.rotation.x = 0;
    armR.rotation.x = 0;
    legL.rotation.x = 0;
    legR.rotation.x = 0;
    body.position.y = 0;
  }

  // POSICIONAMENTO DA CÂMERA EM TERCEIRA PESSOA
  const distance = 8;
  const target = new THREE.Vector3(
    player.position.x,
    player.position.y + 2.1,
    player.position.z
  );

  const horizontalDistance = distance * Math.cos(pitch);

  camera.position.set(
    target.x - Math.sin(yaw) * horizontalDistance,
    target.y + 2.5 + Math.sin(pitch) * distance,
    target.z - Math.cos(yaw) * horizontalDistance
  );

  camera.lookAt(target);
  renderer.render(scene, camera);
}

animate();

// REDIMENSIONAMENTO
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});
</script>
</body>
</html>
